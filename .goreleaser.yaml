version: 2

project_name: zap

builds:
  - id: zap
    main: ./cmd/zap
    binary: zap
    env:
      - CGO_ENABLED=0 # static binaries: no libc dependency, so they also run on Android (Termux)
    flags:
      - -trimpath
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/thecloudranger/zap/internal/version.Version={{ .Version }}
      - -X github.com/thecloudranger/zap/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/thecloudranger/zap/internal/version.Date={{ .Date }}

archives:
  - id: zap
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md through --release-notes (see the release workflow).
# The changelog pipe must stay enabled: it is what reads that file.

homebrew_casks:
  - name: zap
    repository:
      owner: thecloudranger
      name: homebrew-tap
      # GoReleaser accepts exactly {{ .Env.NAME }} here: no other template logic.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Without a tap token (local snapshots) the cask is written but not uploaded.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/thecloudranger/zap
    description: Find stale git worktrees and remove them safely
    license: MIT
    binaries: [zap]
    hooks:
      post:
        # The binary is not notarized; clear the download quarantine so macOS runs it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/zap"]
          end
